# ==========================================================================
# CRE SECRETS (docs/architecture.md #3.3)
# ==========================================================================
# Maps the secret ID the workflow asks for via runtime.GetSecret(&cre.SecretRequest{Id: ...})
# to the environment variable holding its value. In simulation the value comes from .env; once
# deployed, the Vault DON releases it directly into the attested enclave.
#
# Both secrets below are generated by `go run ./cmd/keygen`, which writes them into .env
# without printing them.
#
# WORKFLOW_X25519_PRIVATE_KEY opens the sealed boxes furnishers submit -- it is the only key in
# the system that can turn a commitment back into a position. ATTESTATION_SIGNER_KEY signs the
# verdict so VerdictAttestations.sol can ecrecover it.
secretsNames:
    WORKFLOW_X25519_PRIVATE_KEY:
        - SECRET_WORKFLOW_X25519_PRIVATE_KEY
    ATTESTATION_SIGNER_KEY:
        - SECRET_ATTESTATION_SIGNER_KEY
