specVersion: 1.0.0
description: Hardpull normalized credit schema -- public protocol ingestion (Aave v3, Morpho Blue, Maple)
# Every address below was confirmed on mainnet (contract calls that only the real contract could
# answer), and every startBlock is that contract's actual deployment block, so nothing is missed.
#
# Indexing Aave from block 16291127 is years of history and takes a long time to sync. For a
# demo where recent positions are all that matter, raise the startBlocks to something recent --
# the trade-off is that the subgraph then only sees positions opened after that point. See
# subgraph/README.md.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AaveV3Pool
    network: mainnet
    source:
      # Aave v3 Pool proxy. Verified live: ADDRESSES_PROVIDER() returns the canonical Aave v3
      # PoolAddressesProvider 0x2f39d218133AFaB8F2B819B1066c7E434Ad94E9e. Start block found by
      # binary-searching an archive node for the first block with code at this address.
      address: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2"
      abi: AaveV3Pool
      startBlock: 16291127
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CreditPosition
        - Subject
      abis:
        - name: AaveV3Pool
          file: ./abis/AaveV3Pool.json
      eventHandlers:
        - event: Borrow(indexed address,address,indexed address,uint256,uint8,uint256,indexed uint16)
          handler: handleAaveBorrow
        - event: Repay(indexed address,indexed address,indexed address,uint256,bool)
          handler: handleAaveRepay
        - event: LiquidationCall(indexed address,indexed address,indexed address,uint256,uint256,address,bool)
          handler: handleAaveLiquidation
      file: ./src/mappings/aave.ts
  - kind: ethereum
    name: MorphoBlue
    network: mainnet
    source:
      # Morpho Blue singleton. Verified live: owner() and DOMAIN_SEPARATOR() both respond.
      address: "0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb"
      abi: MorphoBlue
      startBlock: 18883124
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CreditPosition
        - Subject
      abis:
        - name: MorphoBlue
          file: ./abis/MorphoBlue.json
      eventHandlers:
        - event: Borrow(indexed bytes32,address,indexed address,indexed address,uint256,uint256)
          handler: handleMorphoBorrow
        - event: Repay(indexed bytes32,indexed address,indexed address,uint256,uint256)
          handler: handleMorphoRepay
        - event: Liquidate(indexed bytes32,indexed address,indexed address,uint256,uint256,uint256,uint256,uint256)
          handler: handleMorphoLiquidate
      file: ./src/mappings/morpho.ts
  # Each Maple loan is its own proxy contract deployed by the factory -- there is no single
  # fixed loan address to index. We listen to the factory's InstanceDeployed event and spin up
  # a MapleLoan template data source per loan (docs/plan.md T-033).
  - kind: ethereum
    name: MapleLoanFactory
    network: mainnet
    source:
      # Maple fixedTermLoanFactoryV2, from maple-labs/address-registry (MapleAddressRegistryETH).
      # V2 rather than V1: the V1 factory at 0x36a7350309B2Eb30F3B908aB0154851B5ED81db0 reports
      # defaultVersion() == 0 (retired), while this one reports 601 and shares the same
      # mapleGlobals 0x804a6F5F667170F545Bf14e5DDB48C70B788390C. Both checked live.
      address: "0xeA067DB5B32CE036Ee5D8607DBB02f544768dBC6"
      abi: MapleLoanFactory
      startBlock: 18777478
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CreditPosition
      abis:
        - name: MapleLoanFactory
          file: ./abis/MapleLoanFactory.json
      eventHandlers:
        - event: InstanceDeployed(indexed uint256,indexed address,bytes)
          handler: handleMapleLoanDeployed
      file: ./src/mappings/maple.ts
templates:
  - kind: ethereum
    name: MapleLoan
    network: mainnet
    source:
      abi: MapleLoan
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CreditPosition
        - Subject
      abis:
        - name: MapleLoan
          file: ./abis/MapleLoan.json
      eventHandlers:
        - event: Funded(indexed address,uint256,uint256)
          handler: handleMapleFunded
        - event: PaymentMade(uint256,uint256,uint256)
          handler: handleMaplePaymentMade
        - event: LoanClosed(uint256,uint256,uint256)
          handler: handleMapleLoanClosed
      file: ./src/mappings/maple.ts
