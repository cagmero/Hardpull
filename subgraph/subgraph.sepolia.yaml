specVersion: 1.0.0
description: Hardpull normalized credit schema -- Hardpull protocol contracts on Sepolia
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ExposureCommitments
    network: sepolia
    source:
      # Filled in automatically after a Sepolia deploy by `node scripts/sync-deployments.mjs`,
      # which reads docs/deployments.11155111.json. Left as zeros until then on purpose: a wrong
      # address would index nothing and look like a mapping bug (T-034).
      address: "0x0000000000000000000000000000000000000000"
      abi: ExposureCommitments
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - FurnishedCommitment
        - Subject
      abis:
        - name: ExposureCommitments
          file: ./abis/ExposureCommitments.json
      eventHandlers:
        - event: CommitmentWritten(indexed bytes32,indexed bytes32,indexed bytes32,bytes32,uint256,uint256)
          handler: handleCommitmentWritten
      file: ./src/mappings/hardpull.ts
  - kind: ethereum
    name: ReciprocityLedger
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000" # see note above
      abi: ReciprocityLedger
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Furnisher
      abis:
        - name: ReciprocityLedger
          file: ./abis/ReciprocityLedger.json
      eventHandlers:
        - event: ContributionRecorded(indexed bytes32,indexed bytes32,uint256)
          handler: handleContributionRecorded
      file: ./src/mappings/hardpull.ts
